[project]
name = "mfclib"
version = "0.2.5"
description = "A small Python module to manage mass flow controllers for gas mixtures."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Thomas Haeber" }
]
maintainers = [
    { name = "Thomas Haeber" }
]
dependencies = [
    "click>=8.3.1",
    "deprecation>=2.1.0",
    "grpcio[protobuf]>=1.78.0",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "pandas>=3.0.0",
    "pint>=0.25.2",
    "pydantic>=2.12.5",
    "rich>=14.3.2",
    "scipy>=1.17.0",
]

[project.scripts]
mfc = "mfclib.cli.main:run"

[tool.uv]
package = true
python-preference = "only-managed"

[tool.black]
skip-string-normalization = true
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
    ^/foo.py    # exclude a file named foo.py in the root of the project
    | service_pb2_grpc.pyi  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''

[tool.bumpversion]
current_version = "0.2.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = true
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '''^version\s*=\s*([\'\"\`])({current_version})\1'''
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/mfclib/version.py"

[tool.git-changelog]
convention = "angular"
in-place = false
output = "changelog.md"
provider = "github"
sections = "fix,feat,refactor,chore,style,build,test"
template = "angular"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "bump-my-version>=1.2.6",
    "git-changelog>=2.7.1",
    "grpc-stubs>=1.53.0.6",
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-watcher>=0.6.3",
]
